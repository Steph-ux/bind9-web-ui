name: Feature request
description: Suggest an improvement for BIND9 Web UI
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Zones and records
        - ACLs and TSIG
        - RPZ / DNS firewall
        - Remote SSH management
        - Replication
        - Backups and restore
        - Users and API tokens
        - UI / UX
        - Installer / deployment
        - Other

