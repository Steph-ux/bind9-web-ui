#!/usr/sbin/nft -f

flush ruleset

table inet firewall {
    chain input {
        type filter hook input priority 0;
        policy drop;

        # Loopback
        iif lo accept

        # Connexions établies ou liées
        ct state established,related accept

        # Autoriser ICMP (diagnostics)
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Autoriser DNS (TCP/UDP port 53)
        tcp dport 53 accept
        udp dport 53 accept

        # Autoriser le port 10050 pour la communication avec le serveur zabbix
        tcp dport 10050 accept

        # Autoriser SSH depuis IPs spécifiques sur interface ens18
        iifname "ens18" ip saddr 192.168.10.51 tcp dport 22 accept
        iifname "ens18" ip saddr 192.168.10.52 tcp dport 22 accept
        iifname "ens18" ip saddr 192.168.10.53 tcp dport 22 accept
        iifname "ens18" ip saddr 192.168.10.54 tcp dport 22 accept
        iifname "ens18" ip saddr 192.168.10.55 tcp dport 22 accept
        iifname "ens18" ip saddr 192.168.11.74 tcp dport 22 accept
        iifname "ens18" ip saddr 192.168.11.221 tcp dport 22 accept

        # Journaliser ce qui est bloqué (optionnel)
        log prefix "nftables blocked: " limit rate 5/minute

        # Tout le reste est rejeté
        reject with icmpx type admin-prohibited
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}
