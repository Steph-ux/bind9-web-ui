# /etc/wireguard/wg0.conf - dnsrpz02 (Serveur Secondaire / Slave AXFR)
# Reseau dedie securise BIND9 : 10.50.0.0/24
# Permissions : chmod 600 /etc/wireguard/wg0.conf

[Interface]
Address = 10.50.0.2/24
ListenPort = 51820
PrivateKey = <CLE_PRIVEE_DNSRPZ02>

# Peer 1 : dnsrpz01 (Serveur Primaire / Master BIND9)
[Peer]
PublicKey = <CLE_PUBLIQUE_DNSRPZ01>
AllowedIPs = 10.50.0.1/32
Endpoint = 192.168.11.103:51820
PersistentKeepalive = 25

# Peer 2 : Poste d'administration / Console Web BIND9 Control Plane
[Peer]
PublicKey = <CLE_PUBLIQUE_ADMIN>
AllowedIPs = 10.50.0.10/32
PersistentKeepalive = 25
