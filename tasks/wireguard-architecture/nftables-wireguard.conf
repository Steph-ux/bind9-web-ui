#!/usr/sbin/nft -f
# ============================================================================
# /etc/nftables.conf - CLOISONNEMENT RESEAU BIND9 + WIREGUARD
# Machine : dnsrpz01 (192.168.11.103) & dnsrpz02 (192.168.11.106)
# ============================================================================

flush ruleset

table inet firewall {
    chain input {
        type filter hook input priority filter;
        policy drop;

        # 1. Trafic local (Loopback)
        iif "lo" accept

        # 2. Connexions etablies et liees (Stateful Inspection)
        ct state established,related accept

        # 3. Protocoles ICMP (diagnostics reseau sains)
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # 4. TUNNEL WIREGUARD (Port d'ecoute UDP 51820 sur l'interface physique ens18)
        # Permet aux deux serveurs DNS et a l'administrateur de monter le tunnel chiffre
        iifname "ens18" udp dport 51820 accept comment "Handshake WireGuard"

        # 5. RESOLUTION DNS POUR LES CLIENTS DU LAN (ens18)
        # Les postes et equipements locaux peuvent resoudre les noms sans client VPN
        iifname "ens18" tcp dport 53 accept comment "DNS LAN Clients TCP"
        iifname "ens18" udp dport 53 accept comment "DNS LAN Clients UDP"

        # 6. SUPERVISION ZABBIX
        iifname "ens18" ip saddr 192.168.11.74 tcp dport 10050 accept comment "Zabbix Server"

        # 7. RESEAU SECURISE ISOLE WIREGUARD (Interface wg0 - 10.50.0.0/24)
        # Tout le trafic sensible interne a BIND9 et a l'administration passe ici
        iifname "wg0" tcp dport 53 accept comment "Transferts AXFR BIND9 chiffres"
        iifname "wg0" udp dport 53 accept comment "Notifications NOTIFY BIND9 chiffrees"
        iifname "wg0" tcp dport 953 accept comment "Controle RNDC securise via WireGuard"
        iifname "wg0" tcp dport 22 accept comment "Administration SSH exclusivement via WireGuard"

        # 8. GARDE-FOU SSH DE SECOURS (Optionnel : maintenu sur ens18 pendant la phase de test)
        iifname "ens18" ip saddr 192.168.11.74 tcp dport 22 accept comment "SSH Secours Jump"
        iifname "ens18" ip saddr 192.168.11.221 tcp dport 22 accept comment "SSH Secours Steph"

        # 9. Journalisation des paquets bloques
        log prefix "nftables blocked: " limit rate 5/minute burst 5 packets

        # 10. Rejet explicite
        reject with icmpx type admin-prohibited
    }

    chain forward {
        type filter hook forward priority filter;
        policy drop;
    }

    chain output {
        type filter hook output priority filter;
        policy accept;
    }
}
