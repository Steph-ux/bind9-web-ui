# /etc/wireguard/wg0.conf - dnsrpz01 (Serveur Primaire / Master)
# Reseau dedie securise BIND9 : 10.50.0.0/24
# Permissions : chmod 600 /etc/wireguard/wg0.conf

[Interface]
Address = 10.50.0.1/24
ListenPort = 51820
PrivateKey = <CLE_PRIVEE_DNSRPZ01>

# Peer 1 : dnsrpz02 (Serveur Secondaire / Slave AXFR)
[Peer]
PublicKey = <CLE_PUBLIQUE_DNSRPZ02>
AllowedIPs = 10.50.0.2/32
Endpoint = 192.168.11.106:51820
PersistentKeepalive = 25

# Peer 2 : Poste d'administration / Console Web BIND9 Control Plane
[Peer]
PublicKey = <CLE_PUBLIQUE_ADMIN>
AllowedIPs = 10.50.0.10/32
PersistentKeepalive = 25
