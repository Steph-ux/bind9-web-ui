# wg0.conf - Poste Administrateur (Windows / Linux / macOS)
# Permet de joindre dnsrpz01 et dnsrpz02 via le reseau prive isole WireGuard

[Interface]
Address = 10.50.0.10/24
PrivateKey = <CLE_PRIVEE_ADMIN>

# Connexion securisee vers dnsrpz01 (Master)
[Peer]
PublicKey = <CLE_PUBLIQUE_DNSRPZ01>
AllowedIPs = 10.50.0.1/32
Endpoint = 192.168.11.103:51820
PersistentKeepalive = 25

# Connexion securisee vers dnsrpz02 (Slave)
[Peer]
PublicKey = <CLE_PUBLIQUE_DNSRPZ02>
AllowedIPs = 10.50.0.2/32
Endpoint = 192.168.11.106:51820
PersistentKeepalive = 25
