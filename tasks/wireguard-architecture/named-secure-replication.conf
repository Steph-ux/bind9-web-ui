// ============================================================================
// CONFIGURATION BIND9 SUR RESEAU ISOLE WIREGUARD (10.50.0.0/24)
// ============================================================================

// ----------------------------------------------------------------------------
// 1. SUR LE MAITRE dnsrpz01 (192.168.11.103 / WireGuard 10.50.0.1)
// ----------------------------------------------------------------------------

// Dans /etc/bind/named.conf.options :
options {
    directory "/var/cache/bind";

    // BIND9 ecoute sur le LAN ens18 (pour les requetes des clients)
    // ET sur l'interface WireGuard wg0 (pour la replication et le controle)
    listen-on port 53 {
        127.0.0.1;
        192.168.11.103; // LAN ens18 (clients de l'entreprise)
        10.50.0.1;      // WireGuard wg0 (replication securisee)
    };

    // Desactiver l'ecoute non necessaire
    listen-on-v6 { none; };

    // Qui a le droit d'interroger le serveur en resolution :
    allow-query {
        127.0.0.0/8;
        192.168.11.0/24; // Postes et serveurs LAN
        192.168.10.0/24;
        10.50.0.0/24;    // Reseau WireGuard
    };

    // Interdire tout transfert de zone par defaut
    allow-transfer { none; };
};

// Dans /etc/bind/named.conf.local (dnsrpz01 - Maitre) :
// Definition de la zone avec replication restreinte a l'IP WireGuard du slave
zone "intra.isoceltelecom.com" {
    type master;
    file "/var/cache/bind/zones/forward/intra.isoceltelecom.com";

    // Autoriser le transfert AXFR uniquement vers l'IP WireGuard de dnsrpz02
    allow-transfer {
        10.50.0.2; // dnsrpz02 via WireGuard
    };

    // Notifier immediatement dnsrpz02 sur son IP WireGuard lors d'un changement
    also-notify {
        10.50.0.2;
    };
    notify yes;
};

// Controle RNDC restreint a localhost et au poste admin via WireGuard
controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
    inet 10.50.0.1 port 953 allow { 10.50.0.10; } keys { "rndc-key"; };
};


// ----------------------------------------------------------------------------
// 2. SUR L'ESCLAVE dnsrpz02 (192.168.11.106 / WireGuard 10.50.0.2)
// ----------------------------------------------------------------------------

// Dans /etc/bind/named.conf.options :
options {
    directory "/var/cache/bind";

    listen-on port 53 {
        127.0.0.1;
        192.168.11.106; // LAN ens18
        10.50.0.2;      // WireGuard wg0
    };

    listen-on-v6 { none; };

    allow-query {
        127.0.0.0/8;
        192.168.11.0/24;
        192.168.10.0/24;
        10.50.0.0/24;
    };

    allow-transfer { none; };
};

// Dans /etc/bind/named.conf.local (dnsrpz02 - Esclave AXFR) :
zone "intra.isoceltelecom.com" {
    type slave;
    file "/var/cache/bind/zones/forward/intra.isoceltelecom.com";

    // Le maitre source est contacte EXCLUSIVEMENT sur son IP WireGuard chiffree
    masters {
        10.50.0.1; // dnsrpz01 via WireGuard
    };
};
